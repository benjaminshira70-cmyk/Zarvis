<title>ZARVIS</title>
<style>
:root{--c:#00e5ff;--bg:#02060d;--dim:#0a1a2a;--amber:#ffb300}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--c);font-family:ui-monospace,Menlo,monospace;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:radial-gradient(circle at 50% 24%,#06304a 0,#04121f 38%,var(--bg) 70%);transition:--c .3s}
body.listening{--c:var(--amber)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.corner{position:fixed;width:22px;height:22px;border:2px solid var(--c);opacity:.7;pointer-events:none}
.tl{top:calc(env(safe-area-inset-top) + 6px);left:6px;border-right:0;border-bottom:0}
.tr{top:calc(env(safe-area-inset-top) + 6px);right:6px;border-left:0;border-bottom:0}
.bl{bottom:calc(env(safe-area-inset-bottom) + 6px);left:6px;border-right:0;border-top:0}
.br{bottom:calc(env(safe-area-inset-bottom) + 6px);right:6px;border-left:0;border-top:0}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 4px;font-size:11px;letter-spacing:.22em;opacity:.9}
#gear{cursor:pointer;font-size:18px;margin-left:10px}
#stats{display:flex;justify-content:center;gap:18px;font-size:11px;letter-spacing:.16em;opacity:.75;min-height:16px;padding:2px 16px}
#orbwrap{height:210px;display:flex;align-items:center;justify-content:center;flex:none}
.reactor{width:190px;height:190px;position:relative;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;border-radius:50%}
.r1{inset:0;border:1px dashed var(--c);box-shadow:0 0 14px var(--c);animation:spin 26s linear infinite}
.r2{inset:20px;background:repeating-conic-gradient(var(--c) 0 5deg,transparent 5deg 12deg);-webkit-mask:radial-gradient(closest-side,transparent 78%,#000 79%,#000 97%,transparent 100%);mask:radial-gradient(closest-side,transparent 78%,#000 79%,#000 97%,transparent 100%);opacity:.8;animation:spin 16s linear infinite reverse}
.r3{inset:50px;border:2px solid var(--c);box-shadow:0 0 18px var(--c),inset 0 0 18px #00e5ff55}
.core{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--c) 40%,transparent 72%);animation:pulse 3s ease-in-out infinite}
body.listening .core{animation-duration:.7s}
body.speaking .core{animation-duration:.8s}
body.speaking .r3{box-shadow:0 0 30px var(--c),inset 0 0 26px var(--c)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.3);opacity:.75}}
#log{flex:1;overflow-y:auto;padding:8px 18px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.m{max-width:88%;padding:10px 12px;font-size:14px;line-height:1.4;border:1px solid #00e5ff55;background:#00e5ff0d;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));color:#c8f7ff}
.m.u{align-self:flex-end;border-color:#ffb30077;background:#ffb30012;color:#ffe3a3}
.m.z:before{content:"ZARVIS \25B8 ";opacity:.6;font-size:10px;letter-spacing:.15em;color:var(--c)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
a.act{display:inline-block;padding:9px 12px;border:1px solid var(--amber);color:var(--amber);background:#ffb30014;border-radius:4px;font-size:13px;text-decoration:none;box-shadow:0 0 8px #ffb30044}
a.act:active{background:#ffb30040}
#bar{display:flex;gap:7px;padding:10px 12px 12px;border-top:1px solid #00e5ff33;background:#02060dcc}
#t{flex:1;min-width:0;background:var(--dim);border:1px solid #00e5ff66;color:#e0faff;padding:12px;font:16px ui-monospace,Menlo,monospace;border-radius:4px;outline:none}
button{background:var(--dim);border:1px solid var(--c);color:var(--c);width:42px;font-size:19px;border-radius:4px;box-shadow:0 0 8px #00e5ff55;padding:0}
button:active{background:#00e5ff33}
#mic.on,#hf.on{border-color:var(--amber);color:var(--amber);box-shadow:0 0 12px var(--amber)}
#mute.off{opacity:.4}
#kp{display:none;flex-direction:column;gap:8px;padding:0 14px 8px;max-height:46vh;overflow-y:auto}
#kp.show{display:flex}
#kp label{font-size:11px;opacity:.75;letter-spacing:.1em}
#kp input,#kp select{background:var(--dim);border:1px solid #00e5ff88;color:#e0faff;padding:10px;font:16px ui-monospace,Menlo,monospace;border-radius:4px;outline:none;width:100%}
#ksave{width:100%;height:42px;font-size:15px}
</style></head>
<body>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<header><span>Z.A.R.V.I.S // ONLINE</span><span><span id="clock"></span><span id="gear">&#9881;</span></span></header>
<div id="stats"><span id="wx"></span><span id="tmr"></span></div>
<div id="kp">
<label>BRAIN KEY (Groq, starts with gsk_)</label>
<input id="kin" type="password" placeholder="Paste key (leave empty to keep current)" autocomplete="off">
<label>YOUR CITY AND STATE (weather)</label>
<input id="cin" type="text" placeholder="e.g. Tura, Meghalaya" autocomplete="off">
<label>YOUR IPHONE SHORTCUTS (names, separated by commas)</label>
<input id="sin" type="text" placeholder="e.g. Flashlight On, Flashlight Off, Set Alarm" autocomplete="off">
<label>VOICE</label>
<select id="vsel"></select>
<button id="ksave">Save</button>
</div>
<div id="orbwrap"><div class="reactor"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div></div></div>
<div id="log"></div>
<div id="bar">
<button id="mic" aria-label="Voice">&#127908;</button>
<input id="t" placeholder="Speak or type..." autocomplete="off" enterkeyhint="send">
<button id="send" aria-label="Send">&#10148;</button>
<button id="hf" aria-label="Hands-free">&#127911;</button>
<button id="mute" aria-label="Voice replies">&#128266;</button>
</div>
<script>
const $=id=>document.getElementById(id), log=$('log');
let voiceOut=true, hist=[], handsFree=false, busy=false, listening=false, gotResult=false, model='';
const store={
  get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},
  set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}}
};

/* ---------- memory ---------- */
try{hist=JSON.parse(store.get('zh')||'[]')}catch(e){hist=[]}
let facts=[];
try{facts=JSON.parse(store.get('zf')||'[]')}catch(e){facts=[]}
function saveMem(){store.set('zh',JSON.stringify(hist.slice(-20)));store.set('zf',JSON.stringify(facts.slice(-40)))}
async function learn(q,key){
  if(q.length<8||!model) return;
  try{
    const body={model:model,temperature:0,max_tokens:150,messages:[
      {role:'system',content:'Extract lasting personal facts about the user from their message (name, how they like to be addressed, family, job, city, likes, dislikes, goals, routines, important dates, phone numbers of contacts and who they belong to). Reply with ONLY a JSON array of short third-person strings, for example ["The user is called Ben"]. If there is nothing worth remembering, reply []. Facts already known: '+JSON.stringify(facts)},
      {role:'user',content:q}]};
    if(/gpt-oss/.test(model)){body.reasoning_effort='low';body.max_tokens=500}
    const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
    if(!r.ok) return;
    const j=await r.json();
    const m=((j.choices[0].message.content)||'').match(/\[[\s\S]*\]/);
    if(!m) return;
    JSON.parse(m[0]).forEach(f=>{f=String(f).trim();if(f&&f.length<160&&!facts.some(x=>x.toLowerCase()===f.toLowerCase())) facts.push(f)});
    saveMem();
  }catch(e){}
}

/* ---------- live data ---------- */
async function geo(city){
  const parts=city.split(',').map(x=>x.trim()).filter(Boolean);
  const name=parts[0]||city, hint=parts.slice(1).join(' ').toLowerCase();
  const g=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=10&name='+encodeURIComponent(name))).json();
  const rs=g.results||[]; if(!rs.length) return null;
  if(hint){
    const m=rs.find(r=>{const a=((r.admin1||'')+' '+(r.admin2||'')+' '+(r.country||'')).toLowerCase();return a.includes(hint)||(r.admin1&&hint.includes(r.admin1.toLowerCase()))});
    if(m) return m;
  }
  return rs[0];
}
async function getWeather(){
  const city=store.get('zc')||'Delhi';
  const p=await geo(city);
  if(!p) return 'Weather: could not find the place '+city+'.';
  const w=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.latitude+'&longitude='+p.longitude+'&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1')).json();
  const c=w.current, d=w.daily;
  return 'LIVE WEATHER for '+p.name+(p.admin1?', '+p.admin1:'')+': now '+c.temperature_2m+'C (feels like '+c.apparent_temperature+'C), humidity '+c.relative_humidity_2m+'%, wind '+c.wind_speed_10m+' km/h, WMO weather code '+c.weather_code+', today high '+d.temperature_2m_max[0]+'C, low '+d.temperature_2m_min[0]+'C, rain chance '+d.precipitation_probability_max[0]+'%.';
}
async function getNews(){
  const feed='https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en';
  const r=await (await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed))).json();
  const items=(r.items||[]).slice(0,6).map(i=>i.title);
  return items.length?'LIVE TOP NEWS HEADLINES: '+items.join(' | '):'News is unavailable right now.';
}
async function loadWx(){
  try{
    const city=store.get('zc'); if(!city) return;
    const p=await geo(city);
    if(!p) return;
    const w=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.latitude+'&longitude='+p.longitude+'&current=temperature_2m&timezone=auto')).json();
    $('wx').textContent=p.name.toUpperCase()+' '+Math.round(w.current.temperature_2m)+'\u00B0C';
  }catch(e){}
}

/* ---------- phone actions ---------- */
const APPS={youtube:'youtube://',spotify:'spotify://',instagram:'instagram://',whatsapp:'whatsapp://',telegram:'tg://',maps:'maps://',music:'music://',messages:'sms:',phone:'tel:',facetime:'facetime://',mail:'message://',notes:'mobilenotes://',calendar:'calshow://',reminders:'x-apple-reminderkit://',photos:'photos-redirect://',files:'shareddocuments://',chrome:'googlechrome://',twitter:'twitter://'};
function parseActions(text){
  const acts=[];
  const clean=String(text).replace(/\[\[\s*(\w+)\s*:\s*([^\]]*?)\s*\]\]/g,(m,t,v)=>{acts.push({t:t.toLowerCase(),v:v.trim()});return ''}).replace(/\[\[[^\]]*$/,'').replace(/\s+/g,' ').trim();
  return {clean:clean,acts:acts};
}
function toAction(a){
  const e=encodeURIComponent, parts=a.v.split('|');
  const num=parts[0].replace(/[^\d+]/g,''), msg=(parts[1]||'').trim();
  switch(a.t){
    case 'tel': return num?{label:'\uD83D\uDCDE Call '+num,url:'tel:'+num}:null;
    case 'sms': return num?{label:'\uD83D\uDCAC Text '+num,url:'sms:'+num+(msg?'&body='+e(msg):'')}:null;
    case 'wa': return num?{label:'\uD83D\uDFE2 WhatsApp '+num,url:'https://wa.me/'+num.replace('+','')+(msg?'?text='+e(msg):'')}:null;
    case 'maps': return a.v?{label:'\uD83D\uDDFA Map: '+a.v,url:'https://maps.apple.com/?q='+e(a.v)}:null;
    case 'nav': return a.v?{label:'\uD83E\uDDED Directions: '+a.v,url:'https://maps.apple.com/?dirflg=d&daddr='+e(a.v)}:null;
    case 'search': return a.v?{label:'\uD83D\uDD0D Search: '+a.v,url:'https://www.google.com/search?q='+e(a.v)}:null;
    case 'youtube': return a.v?{label:'\u25B6 YouTube: '+a.v,url:'https://www.youtube.com/results?search_query='+e(a.v)}:null;
    case 'open': {const u=APPS[a.v.toLowerCase()];return u?{label:'\uD83D\uDCF1 Open '+a.v,url:u}:null}
    case 'shortcut': return a.v?{label:'\u26A1 Run: '+a.v,url:'shortcuts://run-shortcut?name='+e(a.v)}:null;
  }
  return null;
}
let tmrId=null;
function startTimer(mins){
  const ms=Math.round(parseFloat(mins)*60000); if(!(ms>0)) return;
  clearInterval(tmrId); const end=Date.now()+ms;
  tmrId=setInterval(()=>{
    const left=end-Date.now();
    if(left<=0){
      clearInterval(tmrId);tmrId=null;$('tmr').textContent='';
      const m='Sir, your timer is up.';add(m,'z');speak(m);
      try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
      return;
    }
    const s=Math.ceil(left/1000);
    $('tmr').textContent='TIMER '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  },500);
}
function runActions(acts,el){
  const box=document.createElement('div');box.className='acts';
  acts.forEach(a=>{
    if(a.t==='timer'){startTimer(a.v);return}
    if(a.t==='note'){if(a.v&&!facts.includes('Note: '+a.v)){facts.push('Note: '+a.v);saveMem()}return}
    const x=toAction(a); if(!x) return;
    const l=document.createElement('a');l.className='act';l.href=x.url;l.textContent=x.label;box.appendChild(l);
  });
  if(box.children.length) el.appendChild(box);
}

/* ---------- brain ---------- */
async function pickModel(key){
  const r=await fetch('https://api.groq.com/openai/v1/models',{headers:{'Authorization':'Bearer '+key}});
  const j=await r.json();
  const ids=(j.data||[]).map(m=>m.id).filter(id=>!/whisper|guard|tts|playai|orpheus|distil|safeguard/i.test(id));
  const prefs=['llama-3.3-70b-versatile','openai/gpt-oss-120b','openai/gpt-oss-20b','llama-3.1-8b-instant'];
  return prefs.find(p=>ids.includes(p))||ids[0]||'';
}
function buildSystem(live){
  const sc=store.get('zs').trim();
  return 'You are ZARVIS, a personal AI assistant in the style of Tony Stark\'s JARVIS: calm, composed, razor-sharp, dryly witty and impeccably polite, with a hint of British understatement. Address the user as "sir" unless they have told you otherwise. This is a spoken conversation: reply in 1-2 short natural sentences, three at most, with no markdown, lists, emojis or stage directions. Be proactive and confident, and occasionally end with a brief question or suggestion. Mirror the language the user speaks. Current time: '+new Date().toString()+'.'
  +(store.get('zc')?'\nThe user lives in '+store.get('zc')+'. Use that as their home location for anything local.':'')
  +(facts.length?'\nThings you remember about the user (use them naturally when relevant, never list them out): '+facts.join('; ')+'.':'')
  +'\nYou can control the user\'s phone by putting action tags at the very END of your reply, after your spoken words. Use a tag only when the user clearly asks for that action. Tags: [[tel:NUMBER]] call; [[sms:NUMBER|message]] text; [[wa:NUMBER|message]] WhatsApp; [[maps:place]] show on map; [[nav:place]] directions; [[search:query]] web search; [[youtube:query]] YouTube search; [[open:APP]] open an app (youtube, spotify, instagram, whatsapp, telegram, maps, music, messages, phone, facetime, mail, notes, calendar, reminders, photos, files); [[timer:MINUTES]] countdown timer that works while this page stays open; [[note:text]] save a note to remember. [[shortcut:NAME]] runs one of the user\'s iPhone Shortcuts; the only ones that exist are: '+(sc||'none')+'. Never invent phone numbers: if you do not know one, ask for it. When you use a tag, say in a few words what you are doing, for example "Calling now, sir." The user taps a button to confirm. If asked for something no tag can do, say so briefly and offer the nearest option.'
  +(live?'\nLive data you can use for this answer (summarise it naturally, do not read it out like a report): '+live:'');
}
async function think(q){
  const key=store.get('zk');
  if(!key) return 'I need my brain key first, sir. Tap the gear at the top and paste your Groq key.';
  const s=q.toLowerCase();
  if(/forget (everything|all|my memory|me)|clear (your |my )?memory|wipe (your )?memory/.test(s)){facts=[];hist=[];saveMem();return 'Memory wiped, sir. Pleased to meet you.'}
  let live='';
  try{
    if(/weather|temperature|rain|forecast|umbrella|how hot|how cold/.test(s)) live+=await getWeather()+'\n';
    if(/news|headline|happening|going on in the world/.test(s)) live+=await getNews()+'\n';
  }catch(e){live+='Live data fetch failed.\n'}
  hist.push({role:'user',content:q}); hist=hist.slice(-20);
  try{
    if(!model) model=await pickModel(key);
    if(!model){hist.pop();return 'I could not find a chat model on your Groq account. Check that your key is valid.'}
    const body={model:model,temperature:.7,max_tokens:300,messages:[{role:'system',content:buildSystem(live)},...hist]};
    if(/gpt-oss/.test(model)){body.reasoning_effort='low';body.max_tokens=800}
    const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok){
      hist.pop();
      if(r.status===401) return 'My key was rejected. Tap the gear and paste a fresh Groq key.';
      if(r.status===429) return 'Too many requests. Give me a few seconds.';
      if(r.status===404||r.status===400){model='';}
      return 'Brain error '+r.status+' with model '+body.model+': '+((j.error&&j.error.message)||'unknown')+' Try again and I will pick another model.';
    }
    const a=((j.choices[0].message.content)||'').trim()||'Apologies, sir, I lost my train of thought. Say that again?';
    hist.push({role:'assistant',content:parseActions(a).clean}); saveMem(); learn(q,key); return a;
  }catch(e){hist.pop();return 'Connection problem: '+e.message}
}

/* ---------- voice out ---------- */
function add(txt,cls){const e=document.createElement('div');e.className='m '+cls;e.textContent=txt;log.appendChild(e);log.scrollTop=log.scrollHeight;return e}
function pickVoice(){
  const all=speechSynthesis.getVoices(), saved=store.get('zv');
  if(saved){const s=all.find(x=>x.name===saved);if(s) return s}
  const v=all.filter(x=>/^en/i.test(x.lang));
  const sc=x=>(/^Ava/i.test(x.name)?20:0)+(/premium/i.test(x.name)?6:0)+(/enhanced/i.test(x.name)?5:0)+(/siri/i.test(x.name)?4:0)+(/^(Samantha|Daniel|Serena|Rishi|Karen|Oliver|Aaron)/i.test(x.name)?2:0)+(/en[-_](IN|GB|US)/i.test(x.lang)?1:0);
  return v.sort((a,b)=>sc(b)-sc(a))[0]||null;
}
function speak(txt,done){
  let fin=false;
  const end=()=>{if(fin) return;fin=true;document.body.classList.remove('speaking');if(done) done()};
  if(!voiceOut||!window.speechSynthesis){end();return}
  speechSynthesis.cancel();
  txt=String(txt).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/\s+/g,' ').trim();
  if(!txt){end();return}
  const parts=txt.match(/[^.!?,;:\u2014]+[.!?,;:\u2014]*/g)||[txt];
  const pv=pickVoice();
  parts.forEach((p,i)=>{
    p=p.trim(); if(!p) return;
    const u=new SpeechSynthesisUtterance(p);
    const q=/\?$/.test(p);
    u.rate=q?1.02:.96; u.pitch=q?1.08:1;
    if(pv) u.voice=pv;
    if(i===0) u.onstart=()=>document.body.classList.add('speaking');
    if(i===parts.length-1){u.onend=end;u.onerror=end}
    speechSynthesis.speak(u);
  });
  setTimeout(end,5000+txt.length*110);
}
function unlockSpeech(){
  try{if(window.speechSynthesis){const w=new SpeechSynthesisUtterance(' ');w.volume=0;speechSynthesis.speak(w)}}catch(e){}
}

/* ---------- conversation ---------- */
function finish(){busy=false;if(handsFree) setTimeout(startListening,400)}
async function handle(q){
  q=q.trim(); if(!q) return;
  busy=true; unlockSpeech();
  add(q,'u'); $('t').value='';
  const raw=await think(q);
  const p=parseActions(raw);
  const el=add(p.clean||'Done, sir.','z');
  runActions(p.acts,el);
  setTimeout(()=>speak(p.clean,finish),300);
}
$('send').onclick=()=>handle($('t').value);
$('t').onkeydown=e=>{if(e.key==='Enter')handle($('t').value)};
$('mute').onclick=()=>{voiceOut=!voiceOut;$('mute').classList.toggle('off',!voiceOut);if(!voiceOut&&window.speechSynthesis)speechSynthesis.cancel()};

/* ---------- voice in ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec;
function startListening(){
  if(!rec||listening||busy) return;
  try{if(window.speechSynthesis) speechSynthesis.cancel()}catch(e){}
  gotResult=false;
  try{rec.start()}catch(e){}
}
function updateHF(){$('hf').classList.toggle('on',handsFree)}
if(SR){
  rec=new SR();rec.lang='en-IN';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=1;
  rec.onstart=()=>{listening=true;$('mic').classList.add('on');document.body.classList.add('listening')};
  rec.onend=()=>{
    listening=false;$('mic').classList.remove('on');document.body.classList.remove('listening');
    if(handsFree&&!busy&&!gotResult) setTimeout(startListening,600);
  };
  rec.onresult=e=>{gotResult=true;handle(e.results[0][0].transcript)};
  rec.onerror=e=>{
    if(e.error==='aborted') return;
    if(e.error==='no-speech'){if(!handsFree) add('I did not catch that. Tap the mic and try again.','z');return}
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){handsFree=false;updateHF();return add('Mic is blocked. Allow the microphone for this site in Safari, and turn on Dictation in Settings > General > Keyboard.','z')}
    add('Mic error: '+e.error,'z');
  };
}
$('mic').onclick=()=>{
  if(!rec) return add('Voice input is not supported here. Typing still works.','z');
  if(listening){try{rec.stop()}catch(e){}return}
  try{if(window.speechSynthesis) speechSynthesis.cancel()}catch(e){}
  busy=false; unlockSpeech(); startListening();
};
$('hf').onclick=()=>{
  if(!rec) return add('Hands-free needs voice input, which this browser does not support.','z');
  handsFree=!handsFree; updateHF();
  if(handsFree){add('Hands-free on, sir. I am listening. Tap the headphones again to stop.','z');busy=false;unlockSpeech();startListening()}
  else{try{rec.stop()}catch(e){}add('Hands-free off.','z')}
};

/* ---------- settings ---------- */
function fillVoices(){
  const sel=$('vsel'); if(!window.speechSynthesis||!sel) return;
  const cur=store.get('zv');
  sel.innerHTML='<option value="">Auto (best available)</option>';
  speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang)).forEach(x=>{
    const o=document.createElement('option');o.value=x.name;o.textContent=x.name+' ('+x.lang+')';
    if(x.name===cur) o.selected=true;sel.appendChild(o);
  });
}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=fillVoices}
fillVoices();
$('gear').onclick=()=>{$('cin').value=store.get('zc');$('sin').value=store.get('zs');fillVoices();$('kp').classList.toggle('show')};
$('ksave').onclick=()=>{
  const k=$('kin').value.trim(), c=$('cin').value.trim();
  let ok=true;
  if(k) ok=store.set('zk',k)&&ok;
  ok=store.set('zc',c)&&ok;
  ok=store.set('zs',$('sin').value.trim())&&ok;
  ok=store.set('zv',$('vsel').value)&&ok;
  model='';
  $('kin').value='';$('kp').classList.remove('show');
  loadWx();
  add(ok?'Settings saved, sir.':'Could not save in this browser.','z');
};

/* ---------- startup ---------- */
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},1000);
loadWx();
hist.slice(-6).forEach(m=>add(m.content,m.role==='user'?'u':'z'));
(function(){
  const h=new Date().getHours();
  const g=h<5?'Working late':h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  add(store.get('zk')?g+', sir. All systems online.':'Welcome, sir. Tap the gear to give me my brain key.','z');
})();
</script>
